name: Build FineIos

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      OUT_NAME: FineIos@didierxit7
      THEOS: ${{ github.workspace }}/theos

    steps:
      - uses: actions/checkout@v4

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-v1

      - name: Instalar Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git "$THEOS"
          rm -rf "$THEOS/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$THEOS/sdks"
          ls "$THEOS/sdks"

      - name: Instalar ldid (si viene del cache)
        if: steps.cache-theos.outputs.cache-hit == 'true'
        run: brew install ldid

      - name: Compilar
        run: make clean && make FINALPACKAGE=1

      - name: Renombrar dylib
        run: |
          SRC=$(find .theos -name "MyMenu.dylib" -not -path "*/debug/*" | head -n 1)
          if [ -z "$SRC" ]; then SRC=$(find .theos -name "MyMenu.dylib" | head -n 1); fi
          if [ -z "$SRC" ]; then echo "No se encontró MyMenu.dylib"; exit 1; fi
          mkdir -p out
          cp "$SRC" "out/${OUT_NAME}.dylib"
          ldid -S "out/${OUT_NAME}.dylib"
          file "out/${OUT_NAME}.dylib"
          ls -la out

      - name: Subir dylib
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_NAME }}
          path: out/${{ env.OUT_NAME }}.dylib
          if-no-files-found: error