name: Build DARK dylib

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: randomblock1/theos-action@v1

      - name: Compile Project
        run: make package

      - name: Find and Prepare dylib
        run: |
          mkdir -p extracted_dylib
          find . -name "*.dylib" -not -path "*/.theos/*" -exec cp {} extracted_dylib/ \;

      - name: Compress to ZIP
        run: |
          cd extracted_dylib
          zip -r ../DARK-dylib.zip *.dylib

      - name: Upload dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DARK-dylib
          path: DARK-dylib.zip
          retention-days: 1
