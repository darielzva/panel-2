name: Build FineIos

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      OUT_NAME: FineIos@didierxit7

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Theos
        run: |
          brew install ldid
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          ls "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Compilar
        run: make clean && make FINALPACKAGE=1

      - name: Renombrar dylib
        run: |
          SRC=$(find .theos -name "MyMenu.dylib" -not -path "*/debug/*" | head -n 1)
          if [ -z "$SRC" ]; then SRC=$(find .theos -name "MyMenu.dylib" | head -n 1); fi
          if [ -z "$SRC" ]; then echo "No se encontró MyMenu.dylib"; exit 1; fi
          mkdir -p out
          cp "$SRC" "out/${OUT_NAME}.dylib"
          ldid -S "out/${OUT_NAME}.dylib"
          file "out/${OUT_NAME}.dylib"
          ls -la out

      - name: Subir dylib
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT_NAME }}
          path: out/${{ env.OUT_NAME }}.dylib
          if-no-files-found: error
