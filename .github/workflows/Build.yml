name: Build Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: Randomblock1/theos-action@v1

      - name: Get SDKs
        run: |
          rm -rf theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git theos/sdks

      - name: Build Dylib
        run: |
          mkdir -p temp_build
          rsync -a "intex dylib/" temp_build/
          cd temp_build
          find . -name "control" -exec perl -pi -e 's/\r//g' {} \; || true
          make clean
          make
        env:
          CFLAGS: "-Wl,-U,___isPlatformVersionAtLeast"
          TARGET: iphone:clang:16.5:13.0
          ARCHS: arm64

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSViet-Dylib
          path: temp_build/.theos/obj/arm64/*.dylib
          if-no-files-found: warn
