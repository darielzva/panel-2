name: Build Dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install ldid dpkg

      - name: Setup Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          rm -rf "$HOME/theos/sdks"
          git clone --depth=1 https://github.com/theos/sdks.git "$HOME/theos/sdks"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build Dylib
        run: |
          mkdir -p temp_build
          rsync -a "intex dylib/" temp_build/
          cd temp_build
          find . -name "control" -exec perl -pi -e 's/\r//g' {} \; || true
          make clean
          make
        env:
          CFLAGS: "-Wl,-U,___isPlatformVersionAtLeast"
          TARGET: iphone:clang:16.5:13.0
          ARCHS: arm64

      - name: Upload Dylib Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOSViet-Dylib
          path: temp_build/.theos/obj/**/*.dylib
          if-no-files-found: warn
